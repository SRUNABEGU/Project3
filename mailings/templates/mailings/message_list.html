{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h2>Сообщения</h2>
  <a class="btn btn-primary" href="{% url 'mailings:message_create' %}">Добавить</a>
</div>
<table class="table">
  <tr><th>Тема</th><th></th></tr>
  {% for m in object_list %}
  <tr>
    <td>{{ m.subject }}</td>
    <td class="text-end">
      <a href="{% url 'mailings:message_detail' m.pk %}">Открыть</a> |
      <a href="{% url 'mailings:message_update' m.pk %}">Изменить</a> |
      <a href="{% url 'mailings:message_delete' m.pk %}">Удалить</a>
    </td>
  </tr>
  {% empty %}<tr><td colspan="2">Пока пусто</td></tr>
  {% endfor %}
</table>
{% endblock %}
