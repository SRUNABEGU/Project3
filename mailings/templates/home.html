{% extends "base.html" %}
{% block title %}Главная{% endblock %}
{% block content %}
<h1 class="mb-4">Сервис рассылок</h1>
<div class="row text-center">
  <div class="col-md-4 mb-3">
    <div class="card"><div class="card-body">
      <div class="display-4">{{ mailings_total }}</div>
      <div class="text-muted">Всего рассылок</div>
    </div></div>
  </div>
  <div class="col-md-4 mb-3">
    <div class="card"><div class="card-body">
      <div class="display-4">{{ mailings_active }}</div>
      <div class="text-muted">Активных рассылок</div>
    </div></div>
  </div>
  <div class="col-md-4 mb-3">
    <div class="card"><div class="card-body">
      <div class="display-4">{{ recipients_total }}</div>
      <div class="text-muted">Уникальных получателей</div>
    </div></div>
  </div>
</div>
{% endblock %}
