{% extends "base.html" %}
{% block content %}
<div class="col-md-6 mx-auto">
  <h2>Вход</h2>
  <form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Войти</button>
  </form>
  <p class="mt-3">
    <a href="{% url 'users:register' %}">Регистрация</a> |
    <a href="{% url 'users:password_reset' %}">Забыли пароль?</a>
  </p>
</div>
{% endblock %}
