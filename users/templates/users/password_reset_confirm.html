{% extends "base.html" %}
{% block content %}
<div class="col-md-6 mx-auto">
  {% if validlink %}
    <h2>Новый пароль</h2>
    <form method="post" class="mt-3">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary">Сохранить</button>
    </form>
  {% else %}
    <h2>Ссылка недействительна</h2>
    <p>Возможно, она уже использована. <a href="{% url 'users:password_reset' %}">Запросить заново</a></p>
  {% endif %}
</div>
{% endblock %}
